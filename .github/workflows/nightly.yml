name: "[Auto] Nightly Builds"

on:
  schedule:
    # every day at 6 pm
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Eden branch to build"
        type: string
        default: master

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ inputs.branch || github.event.client_payload.branch || 'master' }}
      devel: ${{ 'false' }}
      build-id: 'nightly'
    secrets: inherit
