name: "[Manual] Workflow PR"

on:
  pull_request:
    branches:
      - '*'
  workflow_dispatch:
    inputs:
      branch:
        description: "Eden branch to build"
        type: string
        default: master

jobs:
  build:
    name: Build
    concurrency:
      group: test-build-${{ github.ref_name }}
      cancel-in-progress: true
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ inputs.branch || github.event.client_payload.branch || 'master' }}
      devel: ${{ 'true' }}
      build-id: 'test'
    secrets: inherit
