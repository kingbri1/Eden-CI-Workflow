name: "[Auto] Source branch build"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Eden branch to build"
        type: string
        default: master
  repository_dispatch:
    types: [pull_request]

jobs:
  build:
    name: Build
    concurrency:
      group: pull_request-${{ github.event.client_payload.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ inputs.branch || github.event.client_payload.branch || 'master' }}
      devel: ${{ 'true' }}
      build-id: 'pull_request'
    secrets: inherit
