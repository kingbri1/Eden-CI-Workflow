name: Setup
description: Setup ccache, repo, etc

inputs:
  branch:
    description: "Eden branch to build"
    default: master
  key:
    description: 'CPM cache key'
    required: true
  version:
    description: 'CPM cache version'
    required: true

runs:
  using: composite
  steps:
    - name: Install sccache
      uses: Eden-CI/sccache-action@master
      with:
        disable_annotations: true

    - name: Checkout Eden fork
      uses: actions/checkout@v7
      with:
        repository: kingbri1/eden
        ref: ${{ inputs.branch }}
        path: eden
        fetch-depth: 0
        persist-credentials: false

    - name: Prepare source
      shell: bash
      env:
        EDEN_BRANCH: ${{ inputs.branch }}
      run: |
        echo "$EDEN_BRANCH" > eden/GIT-REFSPEC
        git -C eden rev-parse --short=10 HEAD > eden/GIT-COMMIT
        { git -C eden describe --tags HEAD --abbrev=0 || cat WORKFLOW-TAG; } > eden/GIT-TAG
        if [ "$BUILD_ID" = tag ]; then
          cp eden/GIT-TAG eden/GIT-RELEASE
        fi
        {
          echo "ARTIFACT_REF=$(cat eden/GIT-COMMIT)"
          echo "GITHUB_TAG=$(cat eden/GIT-TAG)"
          echo "PROJECT_PRETTYNAME=Eden"
          echo "RELEASE_PGO_HOST=github.com"
          echo "RELEASE_PGO_REPO=Eden-CI/PGO"
        } >> "$GITHUB_ENV"
        rm -rf eden/.git eden/.github eden/.ci
        cp -a eden/. .
        rm -rf eden

    - name: Set up CPM cache
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.cache
        key: ${{ inputs.key }}-cpm-${{ inputs.version }}
