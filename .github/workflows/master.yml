name: "[Auto] Master push"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Eden branch to build"
        type: string
        default: master
  repository_dispatch:
    types: [master]

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ inputs.branch || github.event.client_payload.branch || 'master' }}
      devel: ${{ 'true' }}
      build-id: 'master'
    secrets: inherit
