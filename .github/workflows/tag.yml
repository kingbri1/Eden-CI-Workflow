name: "[Auto] Tagged Release"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Eden branch to build"
        type: string
        default: master
  repository_dispatch:
    types: [tag]

jobs:
  build:
    name: Build
    concurrency:
      group: tag-build
      cancel-in-progress: true
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ inputs.branch || github.event.client_payload.branch || 'master' }}
      devel: ${{ 'false' }}
      build-id: 'tag'
    secrets: inherit
