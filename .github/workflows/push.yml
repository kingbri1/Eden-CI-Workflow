name: "[Manual] Master branch test"

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:
    inputs:
      branch:
        description: "Eden branch to build"
        type: string
        default: master

jobs:
  build:
    name: Build
    concurrency:
      group: push-build
      cancel-in-progress: false
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ inputs.branch || github.event.client_payload.branch || 'master' }}
      devel: ${{ 'true' }}
      build-id: 'push'
    secrets: inherit
