name: "Build"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Eden branch to build"
        type: string
        default: master
  workflow_call:
    inputs:
      branch:
        description: "Eden branch to build"
        type: string
        default: master
      build-id:
        description: 'Identifier for workflows and caching'
        type: string
        required: true
      devel:
        description: 'Development mode (disables update checker)'
        type: string
        required: true

jobs:
  linux:
    name: AppImage
    uses: ./.github/workflows/appimage.yml
    with:
      branch: ${{ inputs.branch }}
      build-id: ${{ inputs.build-id || 'push' }}
      cpm-cache-version: v21
      devel: ${{ inputs.devel || 'true' }}
      force_pgo: ${{ 'false' }}
    secrets: inherit

  android:
    name: Android
    uses: ./.github/workflows/android.yml
    with:
      branch: ${{ inputs.branch }}
      build-id: ${{ inputs.build-id || 'push' }}
      cpm-cache-version: v21
      devel: ${{ inputs.devel || 'true' }}
      force_pgo: ${{ 'false' }}
    secrets: inherit
